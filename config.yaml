#   cluster:
#     enabled: false
#     hosts: ["redis-node1:6379", "redis-node2:6379", "redis-node3:6379"]
# ignite:
#   scheme: "http"
#   host: "127.0.0.1"
#   port: 8080
#   secure: false
#   headers: !!omap
#     - Content-Length: 0
#   cache:
#     name: "cacheName"
#     create_on_start: false
compression:
  type: "snappy" # Can also be "none"
metrics:
  type: "none" # Can also be "influx"
  influx:
    host: "http://influx.prebid.com"
    database: "some-database"
    username: "influx-username"
    password: "influx-password"
routes:
  allow_public_write: true
